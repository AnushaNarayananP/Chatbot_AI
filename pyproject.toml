[project]
name = "friendlybot"
version = "1.0.0"
description = "FriendlyBot (Avi) — AI-Powered Document Intelligence Chatbot"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
addopts = "-p no:asyncio -p no:phoenix"
tmp_path_retention_policy = "none"
testpaths = ["tests"]

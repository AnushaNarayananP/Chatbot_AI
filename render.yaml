services:
  - type: web
    name: friendlybot-avi
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_GEMINI_VISION
        value: "true"
      - key: GEMINI_TEXT_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_VISION_MODEL
        value: "gemini-2.5-flash"
      - key: OPENROUTER_TEXT_MODEL
        value: "google/gemini-2.5-flash"
      - key: OPENROUTER_VISION_MODEL
        value: "google/gemini-2.5-flash"
      - key: ENABLE_RAG
        value: "true"
      - key: ENABLE_MCP_ORCHESTRATOR
        value: "true"
      - key: ALLOW_SAMPLE_INVOICES
        value: "true"
